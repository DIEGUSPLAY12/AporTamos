# Render Blueprint for the AporTamos FastAPI backend.
# Deploy: render.com → New → Blueprint → connect this repo.
# Secrets (sync:false) are entered in the Render dashboard, never committed.

services:
  - type: web
    name: aportamos-backend
    runtime: python
    rootDir: AporTamos-Backend
    plan: free
    # Keep the backend in Europe, close to the Supabase DB (Stockholm) and to
    # users in Spain. Oregon (US) added ~600ms/request crossing the Atlantic.
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SMTP_FROM_NAME
        value: AporTamos
      # ── Secrets — paste these in the Render dashboard (Environment) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── Email via Brevo HTTP API (Render blocks SMTP) ──
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
