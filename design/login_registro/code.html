<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AporTamos - Iniciar Sesión</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#1b1b23",
                    "secondary": "#9d4300",
                    "inverse-primary": "#c0c1ff",
                    "on-tertiary-container": "#fffbff",
                    "inverse-surface": "#303038",
                    "tertiary-fixed-dim": "#ffb783",
                    "on-surface-variant": "#464554",
                    "surface-tint": "#494bd6",
                    "on-secondary": "#ffffff",
                    "background": "#fcf8ff",
                    "tertiary-container": "#b55d00",
                    "surface-container-low": "#f5f2fe",
                    "on-error-container": "#93000a",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-error": "#ffffff",
                    "surface-bright": "#fcf8ff",
                    "on-secondary-fixed-variant": "#783200",
                    "inverse-on-surface": "#f2effb",
                    "on-tertiary-fixed": "#301400",
                    "on-secondary-fixed": "#341100",
                    "surface-container-high": "#e9e6f3",
                    "on-primary-container": "#fffbff",
                    "primary-fixed": "#e1e0ff",
                    "secondary-fixed-dim": "#ffb690",
                    "outline": "#767586",
                    "surface-container-highest": "#e4e1ed",
                    "surface-container": "#efecf8",
                    "surface": "#fcf8ff",
                    "error": "#ba1a1a",
                    "error-container": "#ffdad6",
                    "tertiary": "#904900",
                    "primary": "#4648d4",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c7c4d7",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-variant": "#e4e1ed",
                    "on-secondary-container": "#5c2400",
                    "surface-dim": "#dbd8e4",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "on-primary-fixed": "#07006c",
                    "on-tertiary-fixed-variant": "#703700",
                    "secondary-fixed": "#ffdbca",
                    "tertiary-fixed": "#ffdcc5",
                    "on-surface": "#1b1b23",
                    "primary-container": "#6063ee",
                    "secondary-container": "#fd761a"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin": "20px",
                    "grid-columns": "4",
                    "inline-gap": "12px",
                    "stack-gap": "16px",
                    "section-padding": "32px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "label-bold": ["Inter"],
                    "display-xl": ["Plus Jakarta Sans"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-bold": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "display-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]

          }
        }
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-6 antialiased">
<!-- Main Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl p-8 shadow-[0px_10px_30px_rgba(0,0,0,0.04)] border border-surface-variant flex flex-col relative overflow-hidden">
<!-- Decorative subtle gradient blob for gamified feel -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header / Logo Area -->
<header class="flex flex-col items-center text-center mb-8 relative z-10">
<!-- Brand Logo (House + Trophy concept) -->
<div class="relative w-20 h-20 mb-6 flex items-center justify-center">
<div class="absolute inset-0 bg-primary-container rounded-full opacity-20"></div>
<div class="w-16 h-16 bg-primary rounded-[24px] flex items-center justify-center text-on-primary shadow-[0px_15px_35px_rgba(99,102,241,0.25)] relative transform rotate-3">
<span class="material-symbols-outlined text-4xl">home</span>
<div class="absolute -bottom-2 -right-2 w-8 h-8 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary shadow-md border-2 border-surface-container-lowest transform -rotate-12">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
</div>
</div>
<h1 class="font-display-xl text-display-xl text-on-surface mb-2 tracking-tight">AporTamos</h1>
<p class="font-body-md text-body-md text-on-surface-variant">¡Bienvenido! Tu hogar en armonía, empieza aquí.</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-5 relative z-10">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Correo electrónico</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full bg-surface-variant text-on-surface rounded-lg pl-12 pr-4 py-4 outline-none border border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all font-body-md text-body-md placeholder-outline-variant" id="email" placeholder="tu@email.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full bg-surface-variant text-on-surface rounded-lg pl-12 pr-4 py-4 outline-none border border-transparent focus:border-primary focus:bg-surface-container-lowest transition-all font-body-md text-body-md placeholder-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold rounded-full py-4 mt-2 shadow-[0px_8px_20px_rgba(70,72,212,0.2)] hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                Iniciar sesión
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-8 relative z-10">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">O continuar con</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Social Login -->
<div class="flex flex-col gap-3 relative z-10">
<button class="w-full bg-surface-container text-on-surface font-label-bold text-label-bold rounded-full py-3.5 px-4 flex items-center justify-center gap-3 hover:bg-surface-container-high transition-colors border border-surface-dim">
<!-- Using a standard SVG path for Google to ensure brand recognition if Material doesn't have a perfect match, but adhering to constraints, we simulate it with text/layout -->
<span class="w-6 h-6 rounded-full bg-surface-container-lowest flex items-center justify-center text-on-surface font-bold text-xs shadow-sm">G</span>
                Continuar con Google
            </button>
<button class="w-full bg-surface-container text-on-surface font-label-bold text-label-bold rounded-full py-3.5 px-4 flex items-center justify-center gap-3 hover:bg-surface-container-high transition-colors border border-surface-dim">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">ios</span>
                Continuar con Apple
            </button>
</div>
<!-- Registration Link -->
<p class="text-center mt-8 font-body-md text-body-md text-on-surface-variant relative z-10">
            ¿No tienes cuenta? 
            <a class="text-primary font-label-bold hover:text-on-primary-fixed-variant transition-colors ml-1" href="#">Crear nueva cuenta</a>
</p>
</main>
</body></html>
